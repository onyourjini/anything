<!DOCTYPE html>
<head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Countdown</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2? family=Bricolage+Grotesque:wght@400;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="snow" id="snow" aria-hidden="true"></div>
    <main>
        <h1>Christmas Countdown</h1>
        <div class="timer">
            <div class="unit">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="unit">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="unit">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="unit">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <p class="message" id="message" hidden>Merry Christmas!</p>
        <img class="photo" src="penguin.png" alt="Christmas photo">
    </main>
    <script src="script.js"></script>
</body>
</html>
